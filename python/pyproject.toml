[project]
name = "apiverve-interestrate"
version = "1.2.4"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Interest Rate retrieves central bank policy rates for 22 major economies by country code. It delivers the latest interest rate percentage, central bank name, recorded date, and whether the rate moved up, down, or remained unchanged, while paid plans add the 12-month change, the 12-month high, low and average, and the last 12 monthly rates."
keywords = ["interest rate", "central bank", "policy rate", "federal funds rate", "ecb rate"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/interestrate?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/interestrate?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/interestrate-api"
Twitter = "https://twitter.com/apivervehq"
