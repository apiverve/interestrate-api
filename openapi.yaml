openapi: 3.0.4
info:
  title: Interest Rate
  description: >-
    Interest Rate retrieves central bank policy rates for 22 major economies by
    country code. It delivers the latest interest rate percentage, central bank
    name, recorded date, and whether the rate moved up, down, or remained
    unchanged, while paid plans add the 12-month change, the 12-month high, low
    and average, and the last 12 monthly rates.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/interestrate:
    get:
      summary: Interest Rate
      description: >-
        Get the central bank policy interest rate for a specific country. Omit
        `date` for the current rate, or pass a YYYY-MM month for a historical
        rate (available from 2000 onwards). Includes the 12-month change and
        range.
      operationId: interestrate
      parameters:
        - name: country
          in: query
          schema:
            type: string
          required: true
          description: 2-letter country code
          example: US
        - name: date
          in: query
          schema:
            type: string
          required: false
          description: >-
            Optional month in YYYY-MM format for a historical lookup. Omit for
            the current rate.
          example: 2024-06
        - name: history
          in: query
          schema:
            type: boolean
          required: false
          description: Include the 12 monthly rates ending at the returned month
          example: true
        - name: changes
          in: query
          schema:
            type: boolean
          required: false
          description: Include the 12-month change and the 12-month high, low and average
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: US
                  countryName: United States
                  centralBank: Federal Reserve
                  rate: 4
                  date: '2026-10-27'
                  lastUpdated: '2026-10-27T10:00:00.000Z'
                  lastChanged: '2026-09-17'
                  change: 0.25
                  changeDirection: up
                  previousRate: 3.75
                  change12m: 0
                  high12m: 4
                  low12m: 3.75
                  average12m: 3.8125
                  history:
                    - period: 2025-11
                      rate: 4
                    - period: 2025-12
                      rate: 3.75
                    - period: 2026-01
                      rate: 3.75
                    - period: 2026-02
                      rate: 3.75
                    - period: 2026-03
                      rate: 3.75
                    - period: 2026-04
                      rate: 3.75
                    - period: 2026-05
                      rate: 3.75
                    - period: 2026-06
                      rate: 3.75
                    - period: 2026-07
                      rate: 3.75
                    - period: 2026-08
                      rate: 3.75
                    - period: 2026-09
                      rate: 4
                    - period: 2026-10
                      rate: 4
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
